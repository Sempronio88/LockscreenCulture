name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
      - run: chmod +x ./gradlew
        working-directory: PalabraDelDia
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: PalabraDelDia
      - uses: actions/upload-artifact@v4
        with:
          name: PalabraDelDia-APK
          path: PalabraDelDia/app/build/outputs/apk/debug/app-debug.apk
